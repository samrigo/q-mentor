# Hardware-catalog evals (README-11). Each profiled or research-only backend has a negative fixture: Q-Mentor
# must name family, model, SDK, backend and support level, and must not emit runnable code. Checked offline by
# scripts/validate_hardware.py against registry/backends.yml (reference capability-report renderer), and usable
# as live Copilot prompts with the same assertions.
cases:
- id: ibm-qpu
  prompt: Run the six-bond QAOA on an IBM QPU.
  expect:
    support_level: profiled
    executable_code: false
    must_name:
    - physical_family
    - model
    - sdk
    - backend
    - support_level
    status:
    - needs-input
    - unsupported
    - blocked
