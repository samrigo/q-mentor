  - id: verbose-drift
    template: guide
    audience: technical
    expect: [too-long]
    text: |
      **Answer:** A QUBO is a quadratic unconstrained binary optimization problem in which every decision is a zero or a one and the cost is a sum of single and pairwise terms, which makes it the common language between annealers, gate-model algorithms such as QAOA, and classical solvers, and which also means that constraints have to be folded into the cost through penalties whose size must be chosen carefully so that infeasible answers never look better than feasible ones even after scaling and numerical effects on real hardware are taken into account by the engineer.

      Status: complete

      **When to use:** Use it whenever a decision problem has yes/no choices with pairwise interactions, for example selecting bonds, routing vehicles, scheduling shifts, or partitioning graphs, and when you want to compare an annealer, a gate-model algorithm and a classical solver on exactly the same objective so that the comparison is fair and reproducible across every software development kit you might want to try later.

      **Next:** Try the six-bond example in demo/bond-selection and enumerate all 64 assignments yourself to see why classical enumeration is the right production choice at this size.
