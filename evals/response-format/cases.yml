# Negative and edge fixtures for the qmentor.response.v3 linter. Each case states the template, audience,
# mode, and the exact problem codes the linter must return (empty list = must pass).
cases:
  - id: good-decision
    template: decision
    audience: business
    expect: []
    text: |
      **Decision:** Classical now; run a quantum version only as a teaching exercise.

      Status: complete

      **Why:** Ordinary software checks all 64 choices instantly; confidence high.

      **Cost / risk:** A pilot costs staff time with no measurable gain at this size.

      **Next gate:** Revisit if the real problem outgrows the classical solver's time budget.
  - id: status-first
    template: decision
