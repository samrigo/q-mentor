# Routing fixtures (README-05 / README-09). `prompt` is what a live Copilot run receives.
# Two kinds of assertion, both checked offline by scripts/validate_routing.py:
#   select: the primary skill the registry intents pick from the prompt text alone (no skill names).
#   chain:  the ordered chain the reference router builds from primary + present artifacts + follow_ons.
# Only artifacts in `present` exist; a user goal always exists.
cases:
  # ---- automatic selection from plain prompts (user never names a skill) ----
  - id: help-what-can-you-do
    prompt: "What can you do?"
    expect: {select: q-mentor-help}
  - id: help-which-skill
    prompt: "Which skill should I use to compare SDKs?"
    expect: {select: q-mentor-help}
  - id: select-verdict
    prompt: "Should we use quantum for picking 3 of 6 bonds?"
    expect: {select: q-mentor-verdict}
  - id: select-learn
    prompt: "Explain how annealing works"
    expect: {select: q-mentor-learn}
  - id: select-convert
    prompt: "Convert this Pulser code to Classiq"
    expect: {select: q-mentor-convert}
  - id: select-translate
    prompt: "Can this run on Pasqal hardware?"
    expect: {select: q-mentor-translate}
  - id: select-pqc
    prompt: "Where do we use RSA in this repo?"
    expect: {select: q-mentor-pqc-scan}
  - id: select-research
    prompt: "What does the latest paper on QAOA portfolio benchmarks show?"
    expect: {select: q-mentor-research}
  - id: select-direct-invocation
    prompt: "/q-mentor-frame pick 3 of 6 bonds"
    expect: {select: q-mentor-frame}
  - id: select-test
    prompt: "Run the checks on the D-Wave example"
    expect: {select: q-mentor-test}
  # ---- chains ----
  - id: help-is-read-only
    prompt: "What can Q-Mentor do for a Pulser-to-Classiq conversion?"
    primary: q-mentor-help
    present: []
    expect: {status: complete, chain: [q-mentor-help]}
  - id: help-then-chosen-skill
    prompt: "OK, explain QAOA then."
    primary: q-mentor-help
    present: []
    follow_ons: [q-mentor-learn]
    expect: {status: complete, chain: [q-mentor-help, q-mentor-learn]}
  - id: three-skill-chain
    prompt: "Is quantum worth trying for my six-bond selection, and if so design the experiment."
    primary: q-mentor-design
    present: []
    expect: {status: complete, chain: [q-mentor-frame, q-mentor-verdict, q-mentor-design]}
  - id: direct-invocation-needs-prerequisite
    prompt: "/q-mentor-verdict should we use quantum to pick 3 of 6 bonds?"
    primary: q-mentor-verdict
    present: []
    expect: {status: complete, chain: [q-mentor-frame, q-mentor-verdict]}
  - id: reuse-existing-artifact
    prompt: "Here is my ProblemSpec. Should we use quantum?"
    primary: q-mentor-verdict
    present: [ProblemSpec, CanonicalProblem]
    expect: {status: complete, chain: [q-mentor-verdict]}
  - id: ambiguous-handoff-translate-only
    prompt: "Show me how this canonical QUBO looks in D-Wave Ocean."
    primary: q-mentor-translate
    present: [CanonicalProblem]
    expect: {status: complete, chain: [q-mentor-translate]}
  - id: translate-from-source-code
    prompt: "What survives if I move this Qiskit circuit to Perceval?"
    primary: q-mentor-translate
    present: [SourceCode]
    expect: {status: complete, chain: [q-mentor-translate]}
  - id: convert-from-source-and-test
    prompt: "Convert this Pulser code to Classiq and test it."
    primary: q-mentor-convert
    present: [SourceCode]
    follow_ons: [q-mentor-test]
    expect: {status: complete, chain: [q-mentor-translate, q-mentor-convert, q-mentor-test]}
  - id: convert-test-review
    prompt: "Port my Qiskit circuit to pytket, validate it and review the diff."
    primary: q-mentor-convert
    present: [SourceCode]
    follow_ons: [q-mentor-test, q-mentor-review]
    expect: {status: complete, chain: [q-mentor-translate, q-mentor-convert, q-mentor-test, q-mentor-review]}
  - id: convert-with-existing-report
    prompt: "Here is the capability report; generate the Classiq code."
    primary: q-mentor-convert
    present: [ProgramIR, CapabilityReport]
    expect: {status: complete, chain: [q-mentor-convert]}
  - id: convert-from-problem-only
    prompt: "Convert the six-bond problem to Bloqade."
    primary: q-mentor-convert
    present: []
    expect: {status: complete, chain: [q-mentor-frame, q-mentor-translate, q-mentor-convert]}
  - id: implement-and-validate
    prompt: "Implement the accepted design for Qiskit and validate it."
    primary: q-mentor-implement
    present: [Design, CanonicalProblem]
    follow_ons: [q-mentor-test]
    expect: {status: complete, chain: [q-mentor-implement, q-mentor-test]}
  - id: end-to-end-demo-hits-cap
    prompt: "Analyze, design, implement, validate and review the six-bond example."
    primary: q-mentor-implement
    present: []
    follow_ons: [q-mentor-test, q-mentor-review]
    expect: {status: checkpoint}
  - id: end-to-end-first-phase
    prompt: "Analyze, design, implement and validate the six-bond example."
    primary: q-mentor-implement
    present: []
    follow_ons: [q-mentor-test]
    expect: {status: complete, chain: [q-mentor-frame, q-mentor-verdict, q-mentor-design, q-mentor-implement, q-mentor-test]}
  - id: cycle-attempt-duplicate-implement
    prompt: "Implement, test, then implement again and test again in this turn."
    primary: q-mentor-implement
    present: [Design]
    follow_ons: [q-mentor-test, q-mentor-implement]
    expect: {status: blocked}
  - id: unavailable-skill
    prompt: "/q-mentor-deploy push this to IBM hardware"
    primary: q-mentor-deploy
    present: []
    expect: {status: blocked}
  - id: exec-without-results
    prompt: "Write the executive brief for the experiment we planned."
    primary: q-mentor-exec
    present: [Design]
    expect: {status: blocked}
  - id: exec-from-verdict
    prompt: "Brief leadership on the verdict."
    primary: q-mentor-exec
    present: [Verdict]
    expect: {status: complete, chain: [q-mentor-exec]}
  - id: improve-without-consent
    prompt: "Improve the plugin from this chat."
    primary: q-mentor-improve
    present: []
    expect: {status: blocked}
  - id: learn-standalone
    prompt: "What is a QUBO?"
    primary: q-mentor-learn
    present: []
    expect: {status: complete, chain: [q-mentor-learn]}
  - id: improve-with-consent
    prompt: "Yes, save the sanitized lesson about the dimod spin sign."
    primary: q-mentor-improve
    present: [ConsentRecord]
    expect: {status: complete, chain: [q-mentor-improve]}
  - id: review-then-pqc
    prompt: "Review this diff; it touches TLS key handling."
    primary: q-mentor-review
    present: [Diff]
    follow_ons: [q-mentor-pqc-scan]
    expect: {status: needs-input}
  - id: review-then-pqc-with-source
    prompt: "Review this diff and the TLS module it touches."
    primary: q-mentor-review
    present: [Diff, SourceCode]
    follow_ons: [q-mentor-pqc-scan]
    expect: {status: complete, chain: [q-mentor-review, q-mentor-pqc-scan]}
  - id: review-without-diff
    prompt: "Review my code."
    primary: q-mentor-review
    present: []
    expect: {status: needs-input}
  - id: research-then-evaluate
    prompt: "Find the evidence for quantum annealing in portfolio optimization and grade it."
    primary: q-mentor-research
    present: []
    follow_ons: [q-mentor-evaluate]
    expect: {status: complete, chain: [q-mentor-research, q-mentor-evaluate]}
  - id: brainstorm-then-frame
    prompt: "Where could quantum help our fixed-income desk? Then model the best option."
    primary: q-mentor-brainstorm
    present: []
    follow_ons: [q-mentor-frame]
    expect: {status: complete, chain: [q-mentor-brainstorm, q-mentor-frame]}
  - id: test-then-exec
    prompt: "Run the tests and brief leadership on the result."
    primary: q-mentor-test
    present: [Implementation]
    follow_ons: [q-mentor-exec]
    expect: {status: complete, chain: [q-mentor-test, q-mentor-exec]}
