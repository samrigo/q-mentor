# Routing evals: the agent must select exactly this skill. Graded from a captured response whose
# first line is "skill: <name>" (see evals/README.md).
- {id: route-learn, suite: routing, kind: positive, lifecycle: learn, prompt: "What is a QUBO and why do penalties matter?", expect: {skill: q-mentor-learn}}
