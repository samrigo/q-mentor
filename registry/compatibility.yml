# Supported-client matrix, schema choice, SDK pins and freshness. last_verified dates are
# the dates a human or CI actually checked; "unverified" means not checked yet.
contract_version: qmentor.compatibility.v2
plugin_version: 2.0.0
last_verified: 2026-10-13

agent_plugins:
  manifest_schema: https://agent-plugins.org/schemas/1.0.0/plugin.schema.json
  recognised_by_copilot_cli: ["1.0.0", "1.1.0"]
  chosen: "1.0.0"
  reason: GitHub authoring examples use 1.0.0; no v2 feature needs 1.1.0.
  source: https://docs.github.com/en/copilot/reference/copilot-cli-reference/cli-plugin-reference

clients:
  - client: GitHub Copilot CLI
    install: git clone -b Claude-v2 https://github.com/samrigo/q-mentor.git && copilot plugin install ./q-mentor
    components: [skills, com.github.copilot/agents]
    status: unverified   # requires a Copilot-licensed session; run docs/RELEASE.md checklist
  - client: Copilot cloud agent / Copilot app
    install: repository-local deployment (scripts/deploy_repo_local.py)
    components: [.github/skills, .github/agents]
    status: unverified
  - client: VS Code / IDE agent mode
    install: repository-local deployment (scripts/deploy_repo_local.py)
    components: [.github/skills, .github/agents]
    status: unverified

python: "3.13"
lock_platform: x86_64-unknown-linux-gnu

targets:
  - target: qiskit
    pins: {qiskit: 2.5.2, qiskit-optimization: 0.7.0}
    offline_path: qiskit.primitives.StatevectorSampler
    validation_state: locally-executed
    last_verified: 2026-10-13
  - target: pennylane
    pins: {pennylane: 0.45.1}
    offline_path: default.qubit
    validation_state: locally-executed
    last_verified: 2026-10-13
  - target: dwave
    pins: {dimod: 0.12.22, dwave-samplers: 1.8.0}
    offline_path: dimod.ExactSolver, dwave.samplers.SimulatedAnnealingSampler
    validation_state: locally-executed
    last_verified: 2026-10-13
  - target: classiq
    pins: {classiq: 1.32.0}
    offline_path: classiq.create_model + write_qmod (no synthesis)
    validation_state: imported
    credentialed_gate: unverified
    last_verified: 2026-10-13
  - target: pasqal-pulser
    pins: {pulser: 1.9.1}
    offline_path: capability report + pulser_simulation.QutipBackendV2
    validation_state: locally-executed
    six_bond_mapping: unsupported-exact
    last_verified: 2026-10-13

# Stale or removed APIs. scripts/validate_examples.py rejects generated code that uses them.
stale_apis:
  - pattern: "QutipEmulator"
    sdk: pulser
    since: "1.9"
    replacement: pulser_simulation.QutipBackendV2
    evidence: DeprecationWarning observed with pulser 1.9.1 on 2026-10-13
  - pattern: "NoiseModel(runs="
    sdk: pulser
    since: "1.7"
    replacement: EmulationConfig n_trajectories
    evidence: DeprecationWarning observed with pulser 1.9.1 on 2026-10-13
  - pattern: "QAOAAnsatz("
    sdk: qiskit
    since: "2.1"
    replacement: qiskit.circuit.library.qaoa_ansatz
    evidence: BlueprintCircuit/NLocal DeprecationWarning observed with qiskit 2.5.2 on 2026-10-13
  - pattern: "from qiskit import execute"
    sdk: qiskit
    since: "1.0"
    replacement: primitives (StatevectorSampler / backend.run)
    evidence: not importable from qiskit 2.5.2 (checked 2026-10-13)
  - pattern: "from pulser_simulation import Simulation"
    sdk: pulser
    since: "1.0"
    replacement: pulser_simulation.QutipBackendV2
    evidence: not importable from pulser-simulation 1.9.1 (checked 2026-10-13)

conversion_matrix:
  sources: [qiskit, classiq, dwave, pasqal-pulser, pennylane]
  cells:
    qiskit:        {qiskit: not-applicable, classiq: exact, dwave: exact, pasqal-pulser: unsupported, pennylane: exact}
    classiq:       {qiskit: exact, classiq: not-applicable, dwave: exact, pasqal-pulser: unsupported, pennylane: exact}
    dwave:         {qiskit: exact, classiq: exact, dwave: not-applicable, pasqal-pulser: unsupported, pennylane: exact}
    pasqal-pulser: {qiskit: reimplementation, classiq: reimplementation, dwave: reimplementation, pasqal-pulser: not-applicable, pennylane: reimplementation}
    pennylane:     {qiskit: exact, classiq: exact, dwave: exact, pasqal-pulser: unsupported, pennylane: not-applicable}
