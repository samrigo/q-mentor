# Backend capability catalog (qmentor.backends.v3) built from brief/README-11 and README-12.
# physical_family, model (computing model), sdk, backend and support_level are separate fields.
#   tested-local  : a pinned offline example passes in a clean environment (example: path)
#   profiled      : capability documented + fixture in evals/hardware/cases.yml; no runnable adapter
#   research-only : teach/assess only; never executable code
# backend_kind distinguishes a local simulator/emulator from a QPU or a hybrid solver.
# Load ONE record per decision (at most three candidates); never the whole file into context.
# SDK versions: PyPI on 2026-10-14. Access is checked at request time; no paid job runs automatically.
contract_version: qmentor.backends.v3
plugin_version: 3.1.1
last_verified: 2026-10-14
families:
  - superconducting-gate
  - superconducting-cat
  - superconducting-flux-annealer
  - trapped-ion
  - neutral-atom
  - photonic
  - silicon-spin
  - diamond-color-center
  - liquid-state-nmr
  - electrons-on-helium
  - topological
  - none-framework-or-simulator
access_layers:
  - {name: Amazon Braket, kind: access, note: "Cloud access to several vendors (incl. QuEra Aquila AHS); store the concrete device separately."}
  - {name: Azure Quantum, kind: access, note: "Cloud access layer; Q# programs are not evidence of a topological QPU."}
  - {name: Classiq, kind: programming, note: "High-level Qmod modelling and synthesis; synthesis/execution need credentials."}
  - {name: PennyLane, kind: programming, note: "Differentiable framework; always name the concrete device/plugin."}
  - {name: NVIDIA CUDA-Q, kind: runtime, note: "Kernel language and GPU simulation runtime; targets are separate."}
  - {name: Qiskit, kind: programming, note: "Gate SDK; IBM hardware via qiskit-ibm-runtime; other vendors via providers."}
  - {name: pytket, kind: compilation, note: "Compiler and circuit SDK; Quantinuum devices via qnexus."}
  - {name: Q#, kind: language, note: "Language and QDK; target chosen separately."}
backends:
  # ---------------- superconducting gate ----------------
  - id: qiskit-local
    provider: IBM Quantum (Qiskit)
    physical_family: superconducting-gate
    model: gate
    backend_kind: local-simulator
    sdk: {package: qiskit, version: 2.5.2, maintained: true}
    backend: qiskit.primitives.StatevectorSampler (exact local statevector)
    native_ops: any Qiskit standard gate (no transpilation to hardware basis in the example)
    connectivity: all-to-all (simulator)
    measurement: computational basis; little-endian bitstrings (reverse for canonical order)
    noise: none
    queue_cost_boundary: local CPU only
    local_validation: examples/bond-selection/qiskit (all 64 energies, QAOA p=1 sampling, decode)
    remote_access: IBM QPUs via qiskit-ibm-runtime (see ibm-qpu)
    source_url: https://github.com/Qiskit/qiskit
    example: examples/bond-selection/qiskit
    last_verified: 2026-10-14
    support_level: tested-local
    hardware_questions: [native gates, coupling graph, dynamic circuits, calibration age, two-qubit error, depth]
  - id: ibm-qpu
    provider: IBM Quantum
    physical_family: superconducting-gate
    model: gate
    backend_kind: qpu
    sdk: {package: qiskit-ibm-runtime, version: 0.50.0, maintained: true}
    backend: IBM Heron-class QPUs via Qiskit Runtime (account required)
    native_ops: device basis (e.g. ECR/CZ + single-qubit rotations); read from backend.target at request time
    connectivity: heavy-hex coupling map
    measurement: computational basis; dynamic circuits on supported devices
    noise: device calibration (T1/T2, two-qubit error) changes daily
    queue_cost_boundary: credentialed, queued, plan-dependent cost; explicit approval required
    local_validation: transpile against a fake backend is possible; not shipped as an adapter
    remote_access: credentialed
    source_url: https://docs.quantum.ibm.com/
    example: null
    fixture: evals/hardware/cases.yml#ibm-qpu
    last_verified: 2026-10-14
    support_level: profiled
