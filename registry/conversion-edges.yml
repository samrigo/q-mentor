# Sparse conversion registry (qmentor.conversion-edges.v3), from brief/README-14.
# model_matrix holds the CANDIDATE class for each computing-model pair; it is not a promise of executability.
# edges lists only shipped bridges and negative routes, each with a proof fixture that the CI runs.
# Classes: E exact (supported subset) | C conditional (postselected) | R reimplementation | A approximation | U unsupported.
# An unlisted request gets a capability report first (scripts/route_conversion.py); it is never labelled
# supported without a fixture. Re-read SDK docs, changelog, commit SHA and issues before each release.
contract_version: qmentor.conversion-edges.v3
plugin_version: 3.1.1
checked_at: 2026-10-14
model_matrix:
  gate:           {gate: E, rydberg-analog: A or R, anneal: R, photonic-DV: C, photonic-CV: U, research-only: U}
  rydberg-analog: {gate: A or R, rydberg-analog: E or A, anneal: R, photonic-DV: U, photonic-CV: U, research-only: U}
  anneal:         {gate: R, rydberg-analog: R, anneal: E, photonic-DV: R, photonic-CV: U, research-only: U}
  photonic-DV:    {gate: C, rydberg-analog: U, anneal: R, photonic-DV: E, photonic-CV: U, research-only: U}
  photonic-CV:    {gate: U, rydberg-analog: U, anneal: U, photonic-DV: U, photonic-CV: E, research-only: U}
  research-only:  {gate: U, rydberg-analog: U, anneal: U, photonic-DV: U, photonic-CV: U, research-only: U}
