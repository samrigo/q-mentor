name: quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate package structure
        run: python scripts/validate_package.py
      - name: Validate math / demo optimum
        run: python scripts/validate_math.py
